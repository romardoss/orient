<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orient — гра</title>
    <link rel="icon" href="isom-2017-2/svg/703.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #ddd;
        font-family: monospace;
        overflow: hidden;
      }
      #app {
        display: flex;
        height: 100vh;
      }
      #left {
        position: relative;
        height: 100vh;
        aspect-ratio: 8 / 9;
        max-width: 60vw;
        flex: none;
      }
      #game {
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
        display: block;
        background: #000;
        cursor: ew-resize;
        touch-action: none;
      }
      #right {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      #map {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        touch-action: none;
      }
      #map:active {
        cursor: grabbing;
      }
      #map-hint {
        position: absolute;
        left: 8px;
        bottom: 6px;
        font-size: 12px;
        color: #ccc;
        background: rgba(0, 0, 0, 0.45);
        padding: 2px 6px;
        pointer-events: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0d1117;
        font-size: 18px;
      }
      #loading b {
        color: #f07a1e;
        font-size: 28px;
        letter-spacing: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="left">
        <canvas id="game"></canvas>
        <div id="loading">
          <b>ORIENT</b>
          <span>Генерація карти: <span id="loading-stage">…</span></span>
          <small id="seed"></small>
        </div>
      </div>
      <div id="right">
        <canvas id="map"></canvas>
        <div id="map-hint">колесо — масштаб · тягни — зсув · +/− · F — уся карта</div>
      </div>
    </div>
    <script type="module" src="./game/src/main.ts"></script>
  </body>
</html>
