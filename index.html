<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orient — гра</title>
    <link rel="icon" href="isom-2017-2/svg/703.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #ddd;
        font-family: monospace;
        overflow: hidden;
      }
      #app {
        display: flex;
        height: 100vh;
      }
      #left {
        position: relative;
        height: 100vh;
        aspect-ratio: 8 / 9;
        max-width: 60vw;
        flex: none;
      }
      #game {
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
        display: block;
        background: #000;
        cursor: ew-resize;
        touch-action: none;
      }
      #right {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      #map {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        touch-action: none;
      }
      #map:active {
        cursor: grabbing;
      }
      #map-hint {
        position: absolute;
        left: 8px;
        bottom: 6px;
        font-size: 12px;
        color: #ccc;
        background: rgba(0, 0, 0, 0.45);
        padding: 2px 6px;
        pointer-events: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0d1117;
        font-size: 18px;
      }
      #loading b {
        color: #f07a1e;
        font-size: 28px;
        letter-spacing: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="left">
        <canvas id="game"></canvas>
        <div id="loading">
          <b>ORIENT</b>
          <span>Генерація карти: <span id="loading-stage">…</span></span>
          <small id="seed"></small>
        </div>
      </div>
      <div id="right">
        <canvas id="map"></canvas>
        <div id="map-hint">колесо — масштаб · тягни — зсув · +/− · F — уся карта</div>
      </div>
    </div>
    <script>
      // Boot guard (plain script, runs even when the game module can't load): the loading line must
      // end in "Помилка: …" instead of hanging on "…".
      (function () {
        var stage = document.getElementById("loading-stage");
        var loading = document.getElementById("loading");
        var hint =
          location.protocol === "file:"
            ? " Сторінку відкрито як файл — браузер блокує модулі. Запустіть через сервер: npm run game (або npx vite preview після npm run build)."
            : "";
        function fail(msg) {
          if (loading.style.display === "none" || /^Помилка:/.test(stage.textContent)) return;
          stage.textContent = "Помилка: " + msg + hint;
        }
        window.__orientFail = fail;
        // resource load failures (script / module imports) don't bubble — catch them in the capture phase
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t !== window && (t.src || t.href)) fail("не вдалося завантажити " + (t.src || t.href));
            else fail(e.message || "невідома помилка скрипту");
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          fail((r && r.message) || String(r));
        });
        // the module never started at all (blocked, 404, wrong MIME type…)
        setTimeout(function () {
          if (!window.__orientStarted) fail("гра не запустилася (скрипт гри не завантажився).");
        }, 6000);
      })();
    </script>
    <script type="module" src="./game/src/main.ts"></script>
  </body>
</html>
